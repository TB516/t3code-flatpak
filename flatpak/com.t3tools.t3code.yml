id: com.t3tools.t3code
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node26
  - org.freedesktop.Sdk.Extension.rust-stable
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: t3code
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --env=ZYPAK_DISABLE_SANDBOX=1
  - --unset-env=ELECTRON_RUN_AS_NODE
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.secrets
  # Chromium stores secrets in KWallet on KDE.
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  # Preview tab downloads otherwise land in the sandbox's temporary home.
  - --filesystem=xdg-download
  # The host server hands the sandboxed browser a /tmp path for preview downloads.
  - --filesystem=/tmp
  - --filesystem=~/.ssh/config:ro
  - --filesystem=~/.ssh/config.d:ro
  - --filesystem=~/.ssh/known_hosts:ro
  # Read host browser profiles for upstream cookie import.
  - --filesystem=~/.config/google-chrome:ro
  - --filesystem=~/.config/microsoft-edge:ro
  - --filesystem=~/.config/BraveSoftware/Brave-Browser:ro
  - --filesystem=~/.config/vivaldi:ro
  - --filesystem=~/.config/opera:ro
  - --filesystem=~/.config/net.imput.helium:ro
  - --filesystem=~/.mozilla/firefox:ro
  - --filesystem=~/snap/firefox/common/.mozilla/firefox:ro
  - --filesystem=~/.config/zen:ro
  - --filesystem=~/.zen:ro
  - --filesystem=~/.var/app/app.zen_browser.zen/zen:ro

modules:
  - modules/imagemagick.yml
  - modules/pnpm.yml
  - modules/t3code.yml
