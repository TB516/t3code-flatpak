name: Validate Flatpak update

on:
  # Runs on every PR so the required check always reports. A skipped build
  # counts as passing, so PRs without package changes can still merge.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check for package changes
    runs-on: ubuntu-24.04
    outputs:
      # Manual runs always build.
      package: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.package }}
    steps:
      - name: Check changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            package:
              - .github/workflows/validate-flatpak.yml
              - .github/workflows/publish-flatpak.yml
              - flatpak/**
              - '!flatpak/pages/**'
              - patches/**
              - tests/packaged/**

  build:
    name: Build and test Flatpak
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and test Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/com.t3tools.t3code.yml
          branch: stable
          build-bundle: false
          upload-artifact: false
          build-dir: build-flatpak/validation-build
          repo-dir: build-flatpak/validation-repo
          state-dir: build-flatpak/builder-state
          cache-key: flatpak-builder-x86_64-${{ hashFiles('flatpak/**', '!flatpak/pages/**', 'patches/**') }}

      # Launches the built package and checks the sandbox and host still work together.
      - name: Test the packaged app
        run: tests/packaged/run.sh --repo build-flatpak/validation-repo

      - name: Upload packaged app test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-app-test-results
          path: build-flatpak/packaged-test-artifacts
          if-no-files-found: ignore
